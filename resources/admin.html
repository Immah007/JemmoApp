<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JemmoApp — Admin Dispatch Panel</title>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

  <div class="min-h-screen flex flex-col">
    <!-- Top Bar -->
    <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow">
      <div class="flex items-center gap-3">
        <span class="bg-emerald-500 text-slate-950 font-bold px-2.5 py-1 rounded-md text-sm">ADMIN</span>
        <h1 class="font-bold text-lg">JemmoApp Dispatch Center</h1>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="loadOrders()" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition">
          Refresh
        </button>
        <a href="/" class="text-sm text-emerald-400 hover:underline">← Back to JemmoApp</a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl w-full mx-auto px-6 py-8 flex-1">
      
      <!-- Stats Row -->
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-8">
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <p class="text-xs font-semibold text-slate-400 uppercase">Total Orders</p>
          <p id="statTotal" class="text-2xl font-bold text-slate-900 mt-1">0</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <p class="text-xs font-semibold text-amber-500 uppercase">Pending</p>
          <p id="statPending" class="text-2xl font-bold text-slate-900 mt-1">0</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <p class="text-xs font-semibold text-blue-500 uppercase">In Transit</p>
          <p id="statTransit" class="text-2xl font-bold text-slate-900 mt-1">0</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <p class="text-xs font-semibold text-emerald-500 uppercase">Delivered</p>
          <p id="statDelivered" class="text-2xl font-bold text-slate-900 mt-1">0</p>
        </div>
      </div>

      <!-- Orders Table -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center">
          <h2 class="font-bold text-slate-800">Active & Recent Deliveries</h2>
          <span class="text-xs text-slate-400">Auto-updates on action</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50 text-slate-500 text-xs uppercase border-b border-slate-200">
                <th class="py-3 px-6">Order ID</th>
                <th class="py-3 px-6">Customer</th>
                <th class="py-3 px-6">Route (Pickup → Dropoff)</th>
                <th class="py-3 px-6">Item</th>
                <th class="py-3 px-6">Status</th>
                <th class="py-3 px-6 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="ordersTable" class="divide-y divide-slate-100 text-sm">
              <!-- Populated via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    const statusBadge = (status) => {
      const colors = {
        'Pending': 'bg-amber-100 text-amber-800',
        'In Transit': 'bg-blue-100 text-blue-800',
        'Delivered': 'bg-emerald-100 text-emerald-800',
        'Cancelled': 'bg-rose-100 text-rose-800'
      };
      return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold ${colors[status] || 'bg-slate-100'}">${status}</span>`;
    };

    async function loadOrders() {
      const res = await fetch('/api/orders');
      const orders = await res.json();

      // Update stats
      document.getElementById('statTotal').textContent = orders.length;
      document.getElementById('statPending').textContent = orders.filter(o => o.status === 'Pending').length;
      document.getElementById('statTransit').textContent = orders.filter(o => o.status === 'In Transit').length;
      document.getElementById('statDelivered').textContent = orders.filter(o => o.status === 'Delivered').length;

      // Render table
      const tbody = document.getElementById('ordersTable');
      tbody.innerHTML = orders.map(order => `
        <tr class="hover:bg-slate-50 transition">
          <td class="py-4 px-6 font-mono font-semibold text-slate-900">
            ${order.id}
            <div class="text-xs text-slate-400 font-sans font-normal">${order.createdAt}</div>
          </td>
          <td class="py-4 px-6">
            <div class="font-medium text-slate-900">${order.customerName}</div>
            <div class="text-xs text-slate-500">${order.phone}</div>
          </td>
          <td class="py-4 px-6">
            <div class="text-slate-700"><span class="font-semibold text-emerald-600">From:</span> ${order.pickup}</div>
            <div class="text-slate-700"><span class="font-semibold text-rose-600">To:</span> ${order.dropoff}</div>
          </td>
          <td class="py-4 px-6 text-slate-600">${order.item}</td>
          <td class="py-4 px-6">${statusBadge(order.status)}</td>
          <td class="py-4 px-6 text-right space-x-2">
            <select onchange="updateStatus('${order.id}', this.value)" class="border border-slate-300 rounded-lg px-2 py-1 text-xs bg-white">
              <option value="" disabled selected>Change Status</option>
              <option value="Pending">Pending</option>
              <option value="In Transit">In Transit</option>
              <option value="Delivered">Delivered</option>
              <option value="Cancelled">Cancelled</option>
            </select>
            <button onclick="deleteOrder('${order.id}')" class="text-rose-600 hover:text-rose-800 text-xs font-semibold px-2 py-1">
              Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function updateStatus(id, status) {
      await fetch(`/api/orders/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      loadOrders();
    }

    async function deleteOrder(id) {
      if (!confirm('Remove this order from JemmoApp?')) return;
      await fetch(`/api/orders/${id}`, { method: 'DELETE' });
      loadOrders();
    }

    loadOrders();
  </script>
</body>
</html>
